<meta property="og:url" content="https://rafialimran.github.io/cv.html">

<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;else if(matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.dataset.theme='dark'}catch(e){}</script>
</head>
<body data-page="cvpage">
<header id="site-header" class="site-header"></header>
<main class="container">
  <section class="section">
    <div class="section-head" style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:1rem;max-width:none">
      <div>
        <div class="eyebrow">Curriculum Vitae</div>
        <h2>Interactive résumé</h2>
      </div>
      <a class="btn btn-primary" data-cv-pdf href="#" download>Download PDF CV</a>
    </div>
    <div class="grid grid-2" style="align-items:start">
      <div>
        <h3 style="margin-bottom:1.2rem">Career timeline</h3>
        <ul class="timeline" id="cvTimeline"></ul>
        <h3 style="margin:2rem 0 1rem">Languages</h3>
        <div class="card" id="langList"></div>
      </div>
      <div>
        <h3 style="margin-bottom:1.2rem">Education</h3>
        <div class="grid" id="eduList"></div>
        <h3 style="margin:2rem 0 .6rem">Training &amp; certificates</h3>
        <ul style="list-style:none;margin:0;padding:0" id="certList"></ul>
        <h3 style="margin:2rem 0 1rem">References</h3>
        <div class="grid" id="refList"></div>
      </div>
    </div>
  </section>
</main>
<footer id="site-footer" class="site-footer"></footer>

<script src="assets/js/app.js"></script>
