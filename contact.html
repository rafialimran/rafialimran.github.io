<meta property="og:url" content="https://rafialimran.github.io/contact.html">
<meta property="og:image" content="https://rafialimran.github.io/assets/img/og-cover.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://rafialimran.github.io/contact.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;else if(matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.dataset.theme='dark'}catch(e){}</script>
</head>
<body data-page="contact">
<header id="site-header" class="site-header"></header>
<main class="container">
  <section class="section">
    <div class="section-head">
      <div class="eyebrow">Contact</div>
      <h2>Let's build evidence together</h2>
      <p class="lead">Open to MEAL, documentation, research and communications opportunities with humanitarian and development organisations.</p>
    </div>
    <div class="contact-grid">
      <ul class="contact-list" id="contactList"></ul>
      <form id="contactForm" class="card">
        <div class="field"><label for="cf-name">Your name</label><input id="cf-name" name="name" required autocomplete="name"></div>
        <div class="field"><label for="cf-email">Your email</label><input id="cf-email" name="email" type="email" required autocomplete="email"></div>
        <div class="field"><label for="cf-msg">Message</label><textarea id="cf-msg" name="message" required></textarea></div>
        <button class="btn btn-primary" type="submit">Send message</button>
        <p class="muted" style="font-size:.8rem;margin-top:.8rem">Opens your email app with the message pre-filled — no data is stored on this site.</p>
      </form>
    </div>
  </section>
</main>
<footer id="site-footer" class="site-footer"></footer>

<script src="assets/js/app.js"></script>
</body>
</html>
